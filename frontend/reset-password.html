<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acesso | TISSFlow</title><link rel="stylesheet" href="legal.css"></head><body><header class="legal-header"><a class="brand" href="/"><span>+</span> TISS flow</a><a href="/login">Voltar ao login</a></header><main class="legal-page reset-page"><p class="eyebrow">Acesso seguro</p><h1>Recuperar senha</h1><section id="request-reset"><p>Informe o e-mail da sua conta. A resposta não confirma se o endereço está cadastrado.</p><form id="request-reset-form"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><button type="submit">Enviar instruções</button></form></section><section id="apply-reset" hidden><p>Crie uma senha nova com pelo menos 12 caracteres.</p><form id="apply-reset-form"><label>Nova senha<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirmar senha<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Atualizar senha</button></form></section><p id="reset-message" role="status"></p></main><script src="reset-password.js"></script></body></html>
